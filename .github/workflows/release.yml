name: Release Validation

on:
  push:
    tags:
      - "v*"

jobs:
  release-check:
    name: Release check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run release:check

  draft-release-notes:
    name: Draft release notes
    runs-on: ubuntu-latest
    needs: release-check
    permissions:
      contents: write

    steps:
      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body: |
            Review and replace this draft body with the project's release template in `RELEASE_TEMPLATE.md`.

            Suggested checks before publishing:
            - npm package version is already published and verified
            - MCP Registry metadata is current
            - Smithery repository build has been verified if applicable
