name: Bug report
description: Report a defect in tool behavior, packaging, docs, or release flow
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Share the smallest reproduction you can.
      placeholder: |
        1. Configure the MCP server with...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node version, client, and package version if known.
      placeholder: |
        OS:
        Node:
        Client:
        Package version:
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or payload samples
      description: Remove secrets before pasting anything.
